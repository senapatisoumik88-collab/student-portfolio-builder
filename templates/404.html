<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#141e30,#243b55);
            color:white;
        }

        .container{
            text-align:center;
            background:rgba(255,255,255,0.1);
            padding:40px;
            border-radius:20px;
            backdrop-filter:blur(10px);
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
        }

        h1{
            font-size:100px;
            margin-bottom:10px;
            color:#ff4b8b;
        }

        h2{
            margin-bottom:15px;
        }

        p{
            margin-bottom:25px;
            color:#ddd;
        }

        a{
            text-decoration:none;
            background:#ff4b8b;
            color:white;
            padding:12px 24px;
            border-radius:10px;
            transition:0.3s;
        }

        a:hover{
            background:#ff2d75;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>The page you are looking for does not exist.</p>

        <a href="/">Go Back Home</a>

    </div>

</body>
</html>
