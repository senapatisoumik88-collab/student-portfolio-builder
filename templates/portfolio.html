
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} Portfolio</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#141e30,#243b55);
        }

        .card{
            width:420px;
            padding:35px;
            border-radius:20px;
            text-align:center;
            background:rgba(255,255,255,0.1);
            backdrop-filter:blur(12px);
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
            color:white;
        }

        img{
            width:140px;
            height:140px;
            border-radius:50%;
            object-fit:cover;
            border:4px solid white;
            margin-bottom:20px;
        }

        h1{
            margin-bottom:15px;
            font-size:32px;
        }

        h2{
            margin-top:20px;
            margin-bottom:10px;
            color:#ffb347;
        }

        p{
            color:#ddd;
            line-height:1.6;
        }

        .links{
            margin-top:25px;
        }

        .links a{
            display:inline-block;
            margin:10px;
            padding:12px 20px;
            border-radius:10px;
            text-decoration:none;
            color:white;
            background:#ff4b8b;
            transition:0.3s;
        }

        .links a:hover{
            background:#ff2d75;
        }

    </style>

</head>

<body>

    <div class="card">

        <img src="{{ photo }}" alt="Profile Photo">

        <h1>{{ name }}</h1>

        <h2>Skills</h2>
        <p>{{ skill }}</p>

        <h2>Project</h2>
        <p>{{ title }}</p>

        <div class="links">

            <a href="{{ github }}" target="_blank">
                GitHub
            </a>

            <a href="{{ linkedin }}" target="_blank">
                LinkedIn
            </a>

        </div>

    </div>

</body>

</html>
