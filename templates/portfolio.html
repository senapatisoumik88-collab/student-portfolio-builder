<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Portfolio</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{

            background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
            color:white;
        }

        .card{

            width:100%;
            max-width:420px;
            background:rgba(255,255,255,0.08);
            padding:40px;
            border-radius:25px;
            backdrop-filter:blur(10px);
            text-align:center;
            box-shadow:0 0 25px rgba(0,0,0,0.4);
        }

        .profile-pic{

            width:130px;
            height:130px;
            border-radius:50%;
            object-fit:cover;
            border:4px solid #38bdf8;
            margin-bottom:20px;
        }

        h1{
            margin-bottom:20px;
            font-size:40px;
        }

        h2{
            color:#38bdf8;
            margin-top:20px;
            margin-bottom:10px;
        }

        p{
            color:#cbd5e1;
            line-height:1.6;
        }

        .buttons{

            margin-top:30px;
            display:flex;
            justify-content:center;
            gap:15px;
            flex-wrap:wrap;
        }

        .btn{

            padding:12px 20px;
            border-radius:10px;
            text-decoration:none;
            background:#38bdf8;
            color:black;
            font-weight:bold;
            transition:0.3s;
        }

        .btn:hover{
            background:white;
        }

    </style>

</head>

<body>

    <div class="card" id="portfolio">

        <img src="{{ url_for('static', filename=photo) }}"
             class="profile-pic">

        <h1>{{ name }}</h1>

        <h2>Skills</h2>
        <p>{{ skills }}</p>

        <h2>Project</h2>
        <p>{{ project }}</p>

        <div class="buttons">

            <a href="{{ github }}"
               target="_blank"
               class="btn">
               GitHub
            </a>

            <a href="{{ linkedin }}"
               target="_blank"
               class="btn">
               LinkedIn
            </a>

            <button onclick="window.print()"
                    class="btn">
                    Download
            </button>

        </div>

    </div>

</body>

</html>
