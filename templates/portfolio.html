<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
            overflow:hidden;
        }

        .card{
            width:400px;
            padding:35px;
            border-radius:25px;
            text-align:center;
            background:rgba(255,255,255,0.12);
            backdrop-filter:blur(14px);
            border:1px solid rgba(255,255,255,0.2);
            box-shadow:0 10px 40px rgba(0,0,0,0.4);
            color:white;
            transition:0.4s;
        }

        .card:hover{
            transform:translateY(-8px);
            box-shadow:0 15px 45px rgba(37,99,235,0.5);
        }

        img{
            width:140px;
            height:140px;
            border-radius:50%;
            object-fit:cover;
            border:4px solid white;
            margin-bottom:20px;
        }

        h1{
            font-size:32px;
            margin-bottom:10px;
        }

        h2{
            color:#60a5fa;
            margin-top:25px;
            margin-bottom:10px;
        }

        p{
            color:#e2e8f0;
            line-height:1.6;
        }

        a{
            display:inline-block;
            margin-top:25px;
            padding:12px 24px;
            text-decoration:none;
            border-radius:12px;
            background:#2563eb;
            color:white;
            margin-right:10px;
            font-weight:bold;
            transition:0.3s;
        }

        a:hover{
            background:#1d4ed8;
            transform:scale(1.05);
        }

    </style>

</head>

<body>

    <div class="card">

        <img src="{{ photo }}" alt="Profile Photo">

        <h1>{{ name }}</h1>

        <h2>Skills</h2>
        <p>{{ skill }}</p>

        <h2>Project</h2>
        <p>{{ title }}</p>

        <a href="{{ github }}" target="_blank">
            GitHub
        </a>

        <a href="{{ linkedin }}" target="_blank">
            LinkedIn
        </a>

    </div>

</body>

</html>
