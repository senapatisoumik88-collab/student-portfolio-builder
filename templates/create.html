<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Portfolio</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
            color:white;
        }

        .container{
            width:100%;
            max-width:500px;
            background:rgba(255,255,255,0.08);
            padding:40px;
            border-radius:20px;
            backdrop-filter:blur(10px);
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:#38bdf8;
        }

        input, textarea{

            width:100%;
            padding:15px;
            margin-bottom:20px;
            border:none;
            border-radius:10px;
            background:#111827;
            color:white;
            font-size:16px;
        }

        textarea{
            resize:none;
            height:100px;
        }

        button{

            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#38bdf8;
            color:black;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:white;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Create Your Portfolio</h1>

        <form action="/portfolio" method="POST">

            <input type="text"
                   name="name"
                   placeholder="Enter Your Name"
                   required>

            <input type="text"
                   name="skills"
                   placeholder="Enter Your Skills"
                   required>

            <textarea name="project"
                      placeholder="Enter Your Project Details"
                      required></textarea>

            <input type="url"
                   name="github"
                   placeholder="GitHub Profile Link"
                   required>

            <input type="url"
                   name="linkedin"
                   placeholder="LinkedIn Profile Link"
                   required>

            <button type="submit">
                Generate Portfolio
            </button>

        </form>

    </div>

</body>
</html>
