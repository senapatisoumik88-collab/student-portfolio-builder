<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Builder</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#141e30,#243b55);
        }

        .container{
            width:400px;
            padding:35px;
            border-radius:20px;
            background:rgba(255,255,255,0.1);
            backdrop-filter:blur(12px);
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
        }

        h1{
            color:white;
            text-align:center;
            margin-bottom:10px;
        }

        p{
            color:#ddd;
            text-align:center;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:15px;
            border:none;
            border-radius:10px;
            outline:none;
            background:rgba(255,255,255,0.2);
            color:white;
            font-size:15px;
        }

        input::placeholder{
            color:#eee;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#ff4b8b;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#ff2d75;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Portfolio Builder</h1>

        <p>Create your developer portfolio</p>

        <form action="/generate" method="POST">

            <input type="text" name="name" placeholder="Your Name" required>

            <input type="text" name="skill" placeholder="Your Skills" required>

            <input type="text" name="title" placeholder="Project Title" required>

            <input type="text" name="photo" placeholder="Profile Image URL">

            <input type="url" name="github" placeholder="GitHub Link" required>

            <input type="url" name="linkedin" placeholder="LinkedIn Link" required>

            <button type="submit">
                Generate Portfolio
            </button>

        </form>

    </div>

</body>
</html>
