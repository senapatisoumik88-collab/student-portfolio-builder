<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Builder</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#141e30,#243b55);
        }

        .container{
            width:380px;
            padding:35px;
            border-radius:20px;
            background:rgba(255,255,255,0.1);
            backdrop-filter:blur(12px);
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
        }

        h1{
            text-align:center;
            color:white;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#ddd;
            margin-bottom:25px;
            font-size:14px;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:15px;
            border:none;
            border-radius:10px;
            outline:none;
            font-size:15px;
            background:rgba(255,255,255,0.2);
            color:white;
        }

        input::placeholder{
            color:#ddd;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#ff4b8b;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#ff2d75;
        }

        .footer{
            text-align:center;
            margin-top:20px;
            color:#ccc;
            font-size:13px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Portfolio Builder</h1>

        <p class="subtitle">
            Create your professional developer portfolio
        </p>

        <form action="/generate" method="POST">

            <input type="text" name="name" placeholder="Enter Your Name" required>

            <input type="text" name="skill" placeholder="Enter Your Skills" required>

            <input type="text" name="title" placeholder="Project Title" required>

            <input type="text" name="photo" placeholder="Profile Image URL (.jpg/.png)" required>

            <input type="url" name="github" placeholder="GitHub Profile Link" required>

            <input type="url" name="linkedin" placeholder="LinkedIn Profile Link" required>

            <button type="submit">
                Generate Portfolio
            </button>

        </form>

        <div class="footer">
            Flask • HTML • CSS • Render
        </div>

    </div>

</body>

</html>
